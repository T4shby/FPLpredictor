services:
  postgres:
    image: postgres:16-alpine
    container_name: fpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fpl
      POSTGRES_USER: fpl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fpl}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpl -d fpl"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: fpl-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://fpl:${POSTGRES_PASSWORD:-fpl}@postgres:5432/fpl
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: fpl-worker
    restart: unless-stopped
    command: python -m worker.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://fpl:${POSTGRES_PASSWORD:-fpl}@postgres:5432/fpl
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 4g

  nginx:
    image: nginx:1.27-alpine
    container_name: fpl-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    mem_limit: 256m

volumes:
  postgres_data:
