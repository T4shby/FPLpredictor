<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FPL Predictor{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div>
        <a href="/?model={{ model }}">FPL Predictor</a>
        <div class="muted">{{ model_label }} · 2026/27</div>
      </div>
      <nav>
        <a href="/?model={{ model }}">Dashboard</a>
        <a href="/rankings?model={{ model }}">Rankings</a>
      </nav>
    </header>
    <div class="filters models">
      {% for key, label in models.items() %}
      <a href="?model={{ key }}{% if position %}&position={{ position }}{% endif %}" class="{% if model == key %}active{% endif %}">{{ label }}</a>
      {% endfor %}
    </div>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
